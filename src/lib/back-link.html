<!--
  Canonical "back to the portfolio" markup.

  Pasted verbatim into all six demo sites so it becomes a recognisable exit.
  Deliberately static HTML rather than JS-injected: the one link a visitor must
  never lose should not depend on a script having run. Colours come from each
  site through the --pk-back-* custom properties (see base.css).
-->
<a class="pk-back" href="/" aria-label="Back to Preet Kumar's portfolio">
  <svg class="pk-back__arrow" viewBox="0 0 12 12" aria-hidden="true">
    <path d="M11 6H1.6m0 0 4-4m-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="pk-back__mark" aria-hidden="true">PK</span>
  <span class="pk-back__short">Portfolio</span>
  <span class="pk-back__long">Back to Preet's portfolio</span>
</a>
